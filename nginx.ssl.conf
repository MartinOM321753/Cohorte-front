server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Reto HTTP-01 de Let's Encrypt (renovaciones): debe seguir respondiendo sin
    # redirigir a HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Subida de documentos. El backend acepta hasta 55MB
        # (spring.servlet.multipart.max-request-size); sin esta directiva nginx
        # aplica su default de 1m y corta con 413 antes de llegar a Spring.
        client_max_body_size 55m;
        client_body_timeout  300s;
        proxy_request_buffering off;
    }

    # Todo lo demás se redirige a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name hwcs.cipps.unam.mx;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/hwcs.cipps.unam.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hwcs.cipps.unam.mx/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Subida de documentos. El backend acepta hasta 55MB
        # (spring.servlet.multipart.max-request-size); sin esta directiva nginx
        # aplica su default de 1m y corta con 413 antes de llegar a Spring.
        client_max_body_size 55m;
        client_body_timeout  300s;
        proxy_request_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
