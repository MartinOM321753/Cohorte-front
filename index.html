<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <meta name="description" content="IMSS Cohorte - Sistema de gestión de cohortes médicas y investigación clínica" />
    <meta name="theme-color" content="#0F172A" />
    <title>IMSS Cohorte - Sistema Clínico</title>
  </head>
  <body>
    <!-- Anti-flash: lee localStorage antes de que React hidrate para evitar parpadeo de tema -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'imss-verde';
          var valid = ['imss-verde','imss-oscuro','noche-slate','sepia-lectura','alto-contraste','ambar-oled'];
          if (valid.indexOf(t) === -1) t = 'imss-verde';
          document.documentElement.setAttribute('data-theme', t);
          var dark = ['imss-oscuro','noche-slate','ambar-oled'];
          document.documentElement.classList.toggle('dark', dark.indexOf(t) !== -1);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'imss-verde');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
